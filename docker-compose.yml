# Generate docker-compose.yml file based on DockerFile
# This file is used to define and run multi-container Docker applications.
version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: DockerFile
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    environment:
      - MCP_SERVER_PORT=8080
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    networks:
      - app-network
 
networks:
  app-network:
    driver: bridge
